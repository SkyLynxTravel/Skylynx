<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyLynx Content Manager</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // تخصيص واجهة CMS
    CMS.registerPreviewStyle("/style.css");
    
    // معاينة المقالات
    var PostPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var image = entry.getIn(['data', 'image']);
        var bg = this.props.getAsset(image);
        return h('div', {},
          h('div', {style: {
            backgroundImage: `url(${bg.toString()})`,
            backgroundSize: 'cover',
            backgroundPosition: 'center',
            height: '300px',
            borderRadius: '10px',
            marginBottom: '20px'
          }}),
          h('h1', {}, entry.getIn(['data', 'title'])),
          h('div', {style: {
            color: '#666',
            marginBottom: '20px',
            display: 'flex',
            gap: '20px'
          }},
            h('span', {}, entry.getIn(['data', 'date'])),
            h('span', {style: {
              background: '#00a6fb',
              color: 'white',
              padding: '3px 10px',
              borderRadius: '15px',
              fontSize: '14px'
            }}, entry.getIn(['data', 'category']))
          ),
          h('div', {style: {marginBottom: '20px', fontSize: '18px', color: '#666'}}, 
            entry.getIn(['data', 'excerpt'])
          ),
          h('div', {dangerouslySetInnerHTML: {
            __html: this.props.widgetFor('body')
          }})
        );
      }
    });

    CMS.registerPreviewTemplate('blog', PostPreview);
  </script>
</body>
</html>
