<!DOCTYPE html>
<html lang="en" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rental Results | SkyLynx Travel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --deep-ocean: #051923; 
            --sky-glow: #00a6fb; 
            --silver: #e0e1dd; 
            --gold: #d4af37;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        [lang="ar"] { 
            direction: rtl; 
            font-family: 'Cairo', sans-serif;
        }
        
        [lang="en"] { 
            direction: ltr; 
            font-family: 'Montserrat', sans-serif;
        }
        
        body { 
            background-color: var(--deep-ocean); 
            color: white; 
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Header */
        .results-header {
            background: linear-gradient(rgba(5, 25, 35, 0.9), rgba(5, 25, 35, 0.7)),
                        url('https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=1200');
            background-size: cover;
            background-position: center;
            padding: 40px 5%;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .results-header h1 {
            font-family: 'Cinzel';
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: white;
        }
        
        .search-info {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 15px;
            backdrop-filter: blur(10px);
        }
        
        /* Back Button */
        .back-btn {
            position: absolute;
            top: 30px;
            left: 5%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        [lang="ar"] .back-btn {
            left: auto;
            right: 5%;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* Main Container */
        .results-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }
        
        @media (max-width: 992px) {
            .results-container {
                grid-template-columns: 1fr;
            }
        }
        
        /* Filters Sidebar */
        .filters-sidebar {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            height: fit-content;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .filter-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .filter-section h3 {
            color: var(--sky-glow);
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            cursor: pointer;
        }
        
        .filter-option label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .filter-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--sky-glow);
        }
        
        .price-slider {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .price-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--sky-glow);
            cursor: pointer;
        }
        
        .price-range {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--silver);
        }
        
        /* Results List */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .sort-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sort-options select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            min-width: 200px;
        }
        
        .results-count {
            color: var(--silver);
            font-size: 0.9rem;
        }
        
        /* Car Card */
        .car-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            display: grid;
            grid-template-columns: 180px 1fr 180px;
            gap: 25px;
            align-items: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .car-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(0, 166, 251, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .car-card.best-deal::before {
            content: 'PREMIUM FLEET';
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gold);
            color: var(--deep-ocean);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        
        [lang="ar"] .car-card.best-deal::before {
            content: 'أسطول ممتاز';
            right: auto;
            left: 15px;
        }
        
        .car-image {
            width: 100%;
            height: 120px;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .car-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .car-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .car-name {
            font-size: 1.3rem;
            font-weight: 700;
        }
        
        .car-category {
            color: var(--sky-glow);
            font-weight: 500;
        }
        
        .car-specs {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .spec {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--silver);
        }
        
        .car-features {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .feature {
            background: rgba(255,255,255,0.05);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* Price Section */
        .price-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .price {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-align: center;
        }
        
        .price span {
            font-size: 1rem;
            color: var(--silver);
        }
        
        .rent-btn {
            background: linear-gradient(90deg, var(--sky-glow), #006494);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .rent-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 166, 251, 0.3);
        }
        
        .details-btn {
            background: transparent;
            border: 2px solid var(--sky-glow);
            color: var(--sky-glow);
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .details-btn:hover {
            background: rgba(0, 166, 251, 0.1);
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px;
            grid-column: 1 / -1;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--sky-glow);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px;
            grid-column: 1 / -1;
        }
        
        /* Provider Tags */
        .provider-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.1);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            color: var(--silver);
        }
        
        [lang="ar"] .provider-tag {
            left: auto;
            right: 15px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .results-container {
                padding: 20px 15px;
                gap: 20px;
            }
            
            .car-card {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 20px;
            }
            
            .price-section {
                flex-direction: row;
                justify-content: space-between;
            }
            
            .rent-btn, .details-btn {
                width: auto;
                min-width: 140px;
            }
            
            .back-btn {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 20px;
            }
            
            .sort-bar {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
        
        /* Footer */
        .results-footer {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 50px;
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="goBackToMain()" id="backBtn">
    <i class="fas fa-arrow-left"></i>
    <span>Back to Search</span>
</button>

<div class="results-header">
    <h1 id="resultsTitle">Luxury Car Rentals</h1>
    <div class="search-info" id="searchInfo">
        <!-- سيتم ملؤه بالجافاسكريبت -->
    </div>
</div>

<div class="results-container">
    <!-- Filters Sidebar -->
    <aside class="filters-sidebar">
        <div class="filter-section">
            <h3><i class="fas fa-filter"></i> <span id="filterTitle">Car Category</span></h3>
            
            <div class="filter-option">
                <label>
                    <input type="checkbox" id="catLuxury" checked>
                    <span id="luxuryLabel">Luxury Sedans</span>
                </label>
            </div>
            
            <div class="filter-option">
                <label>
                    <input type="checkbox" id="catSUV" checked>
                    <span id="suvLabel">SUVs</span>
                </label>
            </div>
            
            <div class="filter-option">
                <label>
                    <input type="checkbox" id="catSports" checked>
                    <span id="sportsLabel">Sports Cars</span>
                </label>
            </div>
        </div>
        
        <div class="filter-section">
            <h3><i class="fas fa-dollar-sign"></i> <span id="priceTitle">Price per Day</span></h3>
            <input type="range" class="price-slider" id="priceSlider" min="100" max="2000" value="2000">
            <div class="price-range">
                <span id="minPrice">100 CAD</span>
                <span id="maxPrice">2,000 CAD</span>
            </div>
        </div>
        
        <div class="filter-section">
            <h3><i class="fas fa-cogs"></i> <span id="featuresTitle">Features</span></h3>
            <div class="filter-option">
                <label>
                    <input type="checkbox" class="feature-filter" value="chauffeur">
                    <span id="chauffeurLabel">With Chauffeur</span>
                </label>
            </div>
            <div class="filter-option">
                <label>
                    <input type="checkbox" class="feature-filter" value="gps">
                    <span id="gpsLabel">GPS Navigation</span>
                </label>
            </div>
            <div class="filter-option">
                <label>
                    <input type="checkbox" class="feature-filter" value="leather">
                    <span id="leatherLabel">Leather Seats</span>
                </label>
            </div>
            <div class="filter-option">
                <label>
                    <input type="checkbox" class="feature-filter" value="panoramic">
                    <span id="panoramicLabel">Panoramic Roof</span>
                </label>
            </div>
        </div>
        
        <button class="rent-btn" onclick="applyFilters()" id="applyFiltersBtn">
            <i class="fas fa-sync-alt"></i> <span>Apply Filters</span>
        </button>
        <button class="details-btn" onclick="resetFilters()" style="margin-top: 10px;" id="resetFiltersBtn">
            <i class="fas fa-redo"></i> <span>Reset All Filters</span>
        </button>
    </aside>
    
    <!-- Results List -->
    <main class="results-main">
        <div class="sort-bar">
            <div class="results-count" id="resultsCount">
                Loading luxury cars...
            </div>
            <div class="sort-options">
                <select id="sortBy" onchange="sortCars()">
                    <option value="price">Sort by: Price (Low to High)</option>
                    <option value="price-desc">Sort by: Price (High to Low)</option>
                    <option value="category">Sort by: Category</option>
                    <option value="seats">Sort by: Seats</option>
                </select>
            </div>
        </div>
        
        <div class="results-list" id="carResults">
            <!-- سيتم ملؤه بالجافاسكريبت -->
            <div class="loading" id="loadingIndicator">
                <div class="loader"></div>
                <p id="loadingText">Searching for luxury cars...</p>
            </div>
        </div>
    </main>
</div>

<div class="results-footer">
    <p id="footerText">© 2025 SkyLynx Travel | Premium Car Rental Partners</p>
</div>

<script>
// بيانات الترجمة
const langData = {
    en: {
        title: "Luxury Car Rentals",
        back: "Back to Search",
        loading: "Searching for luxury cars...",
        noResults: "No cars found matching your criteria",
        results: "cars found",
        rent: "Reserve Now",
        details: "Details",
        pickup: "Pick-up Location",
        dropoff: "Drop-off Location",
        startDate: "Start Date",
        endDate: "End Date",
        days: "days",
        driver: "With Chauffeur",
        sameLocation: "Same Location",
        filterTitle: "Car Category",
        luxuryLabel: "Luxury Sedans",
        suvLabel: "SUVs",
        sportsLabel: "Sports Cars",
        priceTitle: "Price per Day",
        featuresTitle: "Features",
        chauffeurLabel: "With Chauffeur",
        gpsLabel: "GPS Navigation",
        leatherLabel: "Leather Seats",
        panoramicLabel: "Panoramic Roof",
        applyFilters: "Apply Filters",
        resetFilters: "Reset All Filters",
        footerText: "© 2025 SkyLynx Travel | Premium Car Rental Partners",
        allResults: "Showing all cars",
        failedLoad: "Failed to load cars",
        retry: "Retry",
        passengers: "Passengers",
        transmission: "Transmission",
        fuel: "Fuel Type",
        perDay: "/day"
    },
    ar: {
        title: "تأجير سيارات فاخرة",
        back: "العودة للبحث",
        loading: "جاري البحث عن سيارات فاخرة...",
        noResults: "لا توجد سيارات تطابق معايير البحث",
        results: "سيارة موجودة",
        rent: "احجز الآن",
        details: "التفاصيل",
        pickup: "موقع الاستلام",
        dropoff: "موقع الإرجاع",
        startDate: "تاريخ البدء",
        endDate: "تاريخ الانتهاء",
        days: "أيام",
        driver: "مع سائق",
        sameLocation: "نفس الموقع",
        filterTitle: "فئة السيارة",
        luxuryLabel: "سيدان فاخرة",
        suvLabel: "سياارات الدفع الرباعي",
        sportsLabel: "سيارات رياضية",
        priceTitle: "السعر لكل يوم",
        featuresTitle: "المميزات",
        chauffeurLabel: "مع سائق",
        gpsLabel: "ملاحة GPS",
        leatherLabel: "مقاعد جلدية",
        panoramicLabel: "سقف بانورامي",
        applyFilters: "تطبيق الفلاتر",
        resetFilters: "إعادة تعيين جميع الفلاتر",
        footerText: "© 2025 سكايلينكس للسياحة | شركاء تأجير السيارات الفاخرة",
        allResults: "عرض جميع السيارات",
        failedLoad: "فشل تحميل السيارات",
        retry: "إعادة المحاولة",
        passengers: "الركاب",
        transmission: "ناقل الحركة",
        fuel: "نوع الوقود",
        perDay: "/يوم"
    }
};

// المتغيرات
let currentLang = 'en';
let currentCurrency = 'CAD';
let searchData = {};
let allCars = [];
let filteredCars = [];

// تحميل الصفحة
document.addEventListener('DOMContentLoaded', function() {
    // تحميل التفضيلات
    loadPreferences();
    
    // تحميل بيانات البحث
    loadSearchData();
    
    // تحميل السيارات
    setTimeout(loadCars, 1000);
    
    // إعداد الفلاتر
    setupFilters();
});

// تحميل التفضيلات
function loadPreferences() {
    // اللغة
    const savedLang = localStorage.getItem('language') || 'en';
    currentLang = savedLang;
    document.getElementById('main-html').setAttribute('lang', savedLang);
    
    // العملة
    const savedCurrency = localStorage.getItem('currency') || 'CAD';
    currentCurrency = savedCurrency;
    
    // تحديث أسعار العملة في العرض
    document.getElementById('minPrice').textContent = `100 ${currentCurrency}`;
    document.getElementById('maxPrice').textContent = `2,000 ${currentCurrency}`;
    
    // ترجمة الصفحة
    translatePage();
}

// العودة للصفحة الرئيسية
function goBackToMain() {
    window.location.href = 'index.html';
}

// ترجمة الصفحة
function translatePage() {
    const lang = langData[currentLang];
    
    // تحديث العناوين
    document.getElementById('resultsTitle').textContent = lang.title;
    document.getElementById('backBtn').querySelector('span').textContent = lang.back;
    document.getElementById('loadingText').textContent = lang.loading;
    document.getElementById('filterTitle').textContent = lang.filterTitle;
    document.getElementById('luxuryLabel').textContent = lang.luxuryLabel;
    document.getElementById('suvLabel').textContent = lang.suvLabel;
    document.getElementById('sportsLabel').textContent = lang.sportsLabel;
    document.getElementById('priceTitle').textContent = lang.priceTitle;
    document.getElementById('featuresTitle').textContent = lang.featuresTitle;
    document.getElementById('chauffeurLabel').textContent = lang.chauffeurLabel;
    document.getElementById('gpsLabel').textContent = lang.gpsLabel;
    document.getElementById('leatherLabel').textContent = lang.leatherLabel;
    document.getElementById('panoramicLabel').textContent = lang.panoramicLabel;
    document.getElementById('applyFiltersBtn').querySelector('span').textContent = lang.applyFilters;
    document.getElementById('resetFiltersBtn').querySelector('span').textContent = lang.resetFilters;
    document.getElementById('footerText').textContent = lang.footerText;
    
    // تحديث select الترتيب
    const sortSelect = document.getElementById('sortBy');
    if (currentLang === 'ar') {
        sortSelect.innerHTML = `
            <option value="price">ترتيب حسب: السعر (من الأقل)</option>
            <option value="price-desc">ترتيب حسب: السعر (من الأعلى)</option>
            <option value="category">ترتيب حسب: الفئة</option>
            <option value="seats">ترتيب حسب: المقاعد</option>
        `;
    }
}

// تحميل بيانات البحث
function loadSearchData() {
    try {
        searchData = JSON.parse(localStorage.getItem('carSearchData')) || {
            pickupLocation: 'Dubai Airport',
            dropoffLocation: 'Dubai Airport',
            startDate: new Date().toISOString().split('T')[0],
            endDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
            pickupTime: '10:00',
            returnTime: '18:00',
            withDriver: false,
            sameLocation: true,
            days: 7,
            currency: currentCurrency,
            language: currentLang
        };
        
        // عرض معلومات البحث
        displaySearchInfo();
    } catch (error) {
        console.error('Error loading search data:', error);
        searchData = {
            pickupLocation: 'Dubai Airport',
            dropoffLocation: 'Dubai Airport',
            startDate: new Date().toISOString().split('T')[0],
            endDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
            days: 7,
            withDriver: false,
            currency: 'CAD'
        };
        displaySearchInfo();
    }
}

// عرض معلومات البحث
function displaySearchInfo() {
    const lang = langData[currentLang];
    const infoDiv = document.getElementById('searchInfo');
    
    const pickupLoc = searchData.pickupLocation || 'Dubai Airport';
    const dropoffLoc = searchData.dropoffLocation || 'Same Location';
    
    infoDiv.innerHTML = `
        <div style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;">
            <div><strong>${lang.pickup}:</strong> ${pickupLoc} at ${searchData.pickupTime || '10:00'}</div>
            <div><strong>${lang.dropoff}:</strong> ${dropoffLoc} at ${searchData.returnTime || '18:00'}</div>
            <div><strong>${lang.startDate}:</strong> ${formatDate(searchData.startDate)}</div>
            <div><strong>${lang.endDate}:</strong> ${formatDate(searchData.endDate)}</div>
            <div><strong>${lang.days}:</strong> ${searchData.days || 7} ${lang.days}</div>
            ${searchData.withDriver ? `<div><strong>${lang.driver}:</strong> ✓</div>` : ''}
        </div>
    `;
}

// تنسيق التاريخ
function formatDate(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    return date.toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-CA', {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}

// تحميل السيارات
async function loadCars() {
    try {
        // توليد السيارات
        allCars = generateCars();
        
        // إخفاء التحميل بعد 1 ثانية
        setTimeout(() => {
            document.getElementById('loadingIndicator').style.display = 'none';
            
            // عرض جميع السيارات
            showAllCars();
        }, 1000);
        
    } catch (error) {
        console.error('Error loading cars:', error);
        const lang = langData[currentLang];
        document.getElementById('loadingIndicator').innerHTML = `
            <div style="color: var(--danger); text-align: center;">
                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 20px;"></i>
                <h3>${lang.failedLoad}</h3>
                <button class="details-btn" onclick="location.reload()" style="margin-top: 20px;">
                    <i class="fas fa-redo"></i> ${lang.retry}
                </button>
            </div>
        `;
    }
}

// عرض جميع السيارات بدون فلاتر
function showAllCars() {
    filteredCars = [...allCars]; // نسخ جميع السيارات
    sortCars();
    displayCars();
}

// إعداد الفلاتر
function setupFilters() {
    // تحديث النتائج عند تغيير الفلاتر
    const filterInputs = document.querySelectorAll('input[type="checkbox"], #priceSlider, #sortBy');
    filterInputs.forEach(input => {
        input.addEventListener('change', function() {
            // إذا كان المستخدم يغير الفلاتر، يتم تطبيقها
            applyFilters();
        });
    });
    
    // تحديث سعر العرض
    const slider = document.getElementById('priceSlider');
    const maxPrice = document.getElementById('maxPrice');
    
    slider.addEventListener('input', function() {
        maxPrice.textContent = `${parseInt(this.value).toLocaleString()} ${currentCurrency}`;
    });
    
    // زر إعادة تعيين الفلاتر
    document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
}

// تطبيق الفلاتر
function applyFilters() {
    const maxPrice = parseInt(document.getElementById('priceSlider').value);
    
    // الحصول على الفئات المحددة
    const selectedCategories = [];
    if (document.getElementById('catLuxury').checked) selectedCategories.push('Ultra Luxury Sedan', 'Executive Sedan');
    if (document.getElementById('catSUV').checked) selectedCategories.push('Luxury SUV');
    if (document.getElementById('catSports').checked) selectedCategories.push('Super Sports Car', 'Sports Car');
    
    // الحصول على المميزات المحددة
    const selectedFeatures = [];
    document.querySelectorAll('.feature-filter:checked').forEach(checkbox => {
        selectedFeatures.push(checkbox.value);
    });
    
    // إذا لم يتم اختيار أي فلاتر، عرض جميع النتائج
    if (selectedCategories.length === 0 && selectedFeatures.length === 0) {
        showAllCars();
        return;
    }
    
    // تصفية السيارات
    filteredCars = allCars.filter(car => {
        // تصفية حسب السعر
        if (car.price > maxPrice) return false;
        
        // تصفية حسب الفئة (إذا اختار المستخدم)
        if (selectedCategories.length > 0) {
            if (!selectedCategories.includes(car.category)) return false;
        }
        
        // تصفية حسب المميزات (إذا اختار المستخدم)
        if (selectedFeatures.length > 0) {
            const hasAllFeatures = selectedFeatures.every(feature => {
                if (feature === 'chauffeur') {
                    return car.features.some(f => f.includes('Chauffeur'));
                }
                return car.features.some(f => f.toLowerCase().includes(feature.toLowerCase()));
            });
            if (!hasAllFeatures) return false;
        }
        
        return true;
    });
    
    // تطبيق الترتيب
    sortCars();
    
    // عرض النتائج
    displayCars();
}

// ترتيب السيارات
function sortCars() {
    const sortBy = document.getElementById('sortBy').value;
    
    filteredCars.sort((a, b) => {
        switch (sortBy) {
            case 'price':
                return a.price - b.price;
            case 'price-desc':
                return b.price - a.price;
            case 'category':
                return a.category.localeCompare(b.category);
            case 'seats':
                return b.passengers - a.passengers;
            default:
                return a.price - b.price;
        }
    });
    
    displayCars();
}

// عرض السيارات
function displayCars() {
    const resultsDiv = document.getElementById('carResults');
    const lang = langData[currentLang];
    
    if (filteredCars.length === 0) {
        resultsDiv.innerHTML = `
            <div class="no-results">
                <i class="fas fa-car" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.5;"></i>
                <h3>${lang.noResults}</h3>
                <button class="details-btn" onclick="resetFilters()" style="margin-top: 20px;">
                    <i class="fas fa-redo"></i> ${lang.resetFilters}
                </button>
            </div>
        `;
        document.getElementById('resultsCount').textContent = `0 ${lang.results}`;
        return;
    }
    
    let html = '';
    
    filteredCars.forEach((car, index) => {
        const isBestDeal = car.price === Math.min(...filteredCars.map(c => c.price));
        
        html += `
            <div class="car-card ${isBestDeal ? 'best-deal' : ''}">
                <div class="provider-tag">${car.provider}</div>
                
                <div class="car-image">
                    <img src="${car.image}" alt="${car.name}">
                </div>
                
                <div class="car-details">
                    <div class="car-name">${car.name}</div>
                    <div class="car-category">${car.category}</div>
                    
                    <div class="car-specs">
                        <div class="spec">
                            <i class="fas fa-users"></i>
                            <span>${car.passengers} ${lang.passengers}</span>
                        </div>
                        <div class="spec">
                            <i class="fas fa-cog"></i>
                            <span>${car.transmission}</span>
                        </div>
                        <div class="spec">
                            <i class="fas fa-gas-pump"></i>
                            <span>${car.fuel}</span>
                        </div>
                    </div>
                    
                    <div class="car-features">
                        ${car.features.slice(0, 4).map(feature => `
                            <div class="feature">
                                <i class="fas fa-check-circle"></i> ${feature}
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="price-section">
                    <div class="price">
                        ${car.price.toLocaleString()} <span>${car.currency}${lang.perDay}</span>
                    </div>
                    <button class="rent-btn" onclick="reserveCar('${car.id}')">
                        <i class="fas fa-car"></i> ${lang.rent}
                    </button>
                    <button class="details-btn" onclick="showCarDetails('${car.id}')">
                        <i class="fas fa-info-circle"></i> ${lang.details}
                    </button>
                </div>
            </div>
        `;
    });
    
    resultsDiv.innerHTML = html;
    
    // تحديث عدد النتائج
    if (filteredCars.length === allCars.length) {
        document.getElementById('resultsCount').textContent = `${filteredCars.length} ${lang.results} (${lang.allResults})`;
    } else {
        document.getElementById('resultsCount').textContent = `${filteredCars.length} ${lang.results}`;
    }
}

// إعادة تعيين الفلاتر
function resetFilters() {
    // إعادة تعيين جميع checkboxes
    document.getElementById('catLuxury').checked = true;
    document.getElementById('catSUV').checked = true;
    document.getElementById('catSports').checked = true;
    
    document.querySelectorAll('.feature-filter').forEach(checkbox => {
        checkbox.checked = false;
    });
    
    // إعادة تعيين السعر
    document.getElementById('priceSlider').value = 2000;
    document.getElementById('maxPrice').textContent = `2,000 ${currentCurrency}`;
    
    // عرض جميع السيارات
    showAllCars();
}

// حجز سيارة
function reserveCar(carId) {
    const car = allCars.find(c => c.id === carId);
    if (!car) {
        alert(currentLang === 'ar' ? 'السيارة غير موجودة' : 'Car not found');
        return;
    }
    
    // حفظ السيارة المختارة
    localStorage.setItem('selectedCar', JSON.stringify(car));
    
    // عرض رسالة تأكيد
    const lang = langData[currentLang];
    alert(`${lang.rent}: ${car.name}\n${lang.category}: ${car.category}\n${lang.startDate}: ${formatDate(searchData.startDate)}\n${lang.endDate}: ${formatDate(searchData.endDate)}\n${lang.days}: ${searchData.days || 7} ${lang.days}\nPrice: ${car.price.toLocaleString()} ${car.currency}${lang.perDay}\n\n${currentLang === 'ar' ? 'سيتصل بك مستشار تأجير السيارات خلال 15 دقيقة' : 'Our car rental specialist will contact you within 15 minutes.'}`);
}

// عرض تفاصيل السيارة
function showCarDetails(carId) {
    const car = allCars.find(c => c.id === carId);
    if (!car) return;
    
    const lang = langData[currentLang];
    
    alert(`${car.name}\n\n` +
          `${lang.category}: ${car.category}\n` +
          `${lang.passengers}: ${car.passengers}\n` +
          `${lang.transmission}: ${car.transmission}\n` +
          `${lang.fuel}: ${car.fuel}\n` +
          `Price: ${car.price.toLocaleString()} ${car.currency}${lang.perDay}\n` +
          `Provider: ${car.provider}\n` +
          `Features: ${car.features.join(', ')}`);
}
