:root{--deep-ocean:#00111c;--sky-glow:#00a6fb;--silver:#e0e1dd;--gold:#d4af37}

body{background:var(--deep-ocean);color:white;font-family:'Montserrat',sans-serif;line-height:1.8}
[lang="ar"]{direction:rtl;font-family:'Cairo',sans-serif}
.main-nav{position:fixed;top:0;width:100%;background:rgba(0,17,28,0.98);z-index:1000;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(10px)}
.nav-logo{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-size:1.5rem;font-weight:700}
.nav-logo i{color:var(--sky-glow)}
.lang-toggle{background:rgba(0,166,251,0.2);padding:8px 20px;border-radius:20px;cursor:pointer;transition:all 0.3s}

.blog-card:hover{transform:translateY(-10px);border-color:var(--sky-glow);box-shadow:0 20px 60px rgba(0,166,251,0.4)}
.blog-card:hover::before{opacity:1}
.blog-image{width:100%;height:260px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.blog-image::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom, transparent 0%, rgba(0,17,28,0.8) 100%)}

[lang="ar"] .blog-badge{right:auto;left:20px}
.blog-content{padding:30px;position:relative}
.blog-category{color:var(--sky-glow);font-size:0.95rem;margin-bottom:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.blog-title{font-family:'Cinzel',serif;font-size:1.5rem;margin-bottom:15px;color:white;line-height:1.4;font-weight:600}
.blog-excerpt{color:var(--silver);font-size:1rem;line-height:1.7;margin-bottom:20px}
.blog-meta{display:flex;gap:20px;font-size:0.9rem;color:#888;padding-top:15px;border-top:1px solid rgba(255,255,255,0.1)}
.blog-meta i{color:var(--sky-glow)}
.back-btn{display:inline-flex;align-items:center;gap:10px;margin:80px auto;padding:18px 45px;background:linear-gradient(135deg, var(--sky-glow) 0%, #0088cc 100%);color:white;text-decoration:none;border-radius:35px;font-weight:700;font-size:1.1rem;transition:all 0.3s;box-shadow:0 8px 25px rgba(0,166,251,0.3)}

.article-content h2{font-family:'Cinzel',serif;font-size:2.5rem;color:var(--sky-glow);margin:60px 0 30px}
.article-content h3{color:var(--sky-glow);font-size:1.8rem;margin:40px 0 20px}
.article-content p{color:var(--silver);margin-bottom:25px;line-height:1.9}
.article-content ul{margin:25px 0 25px 40px;color:var(--silver)}
.article-content li{margin-bottom:15px;line-height:1.7}
.article-content strong{color:white}
@media(max-width:768px){
.hero h1{font-size:2.5rem}
.blog-grid{grid-template-columns:1fr;gap:30px}
.section-header h2{font-size:2rem}
