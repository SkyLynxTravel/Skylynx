<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyLynx Travel | Experience the Elevation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep-blue: #020617;
            --electric-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --container-bg: rgba(15, 23, 42, 0.8);
            --font-family: 'Poppins', sans-serif;
        }

        body { 
            font-family: var(--font-family);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: var(--bg-deep-blue); 
            background-image: radial-gradient(circle at center, #0c1c3a 0%, #020617 70%);
            color: var(--text-main); 
            text-align: center; 
        }

        .luxe-container { 
            padding: 70px 50px; 
            border: 2px solid rgba(56, 189, 248, 0.3); 
            border-radius: 40px; 
            background-color: var(--container-bg); 
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.15); 
            max-width: 650px; 
            backdrop-filter: blur(15px);
        }

        .brand-name { 
            color: var(--text-main);
            font-size: 4em; 
            font-weight: 700; 
            margin: 0;
            letter-spacing: -1px;
        }

        .brand-sub {
            color: var(--electric-blue);
            font-size: 1.2em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-top: 5px;
            margin-bottom: 50px;
        }

        /* الكلمات الفخمة التي اتفقنا عليها */
        .headline { 
            color: var(--text-main); 
            font-size: 1.5em; 
            line-height: 1.6; 
            font-weight: 400;
            margin-bottom: 20px;
        }

        .sub-headline {
            color: var(--text-sub);
            font-size: 1.1em;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent);
            margin: 30px auto;
        }

        .legal-note { 
            font-size: 0.85em; 
            color: rgba(148, 163, 184, 0.6); 
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="luxe-container">
        
        <h1 class="brand-name">SkyLynx</h1>
        <div class="brand-sub">Travel</div>
        
        <div class="headline">
            We are currently elevating our platform to deliver an unparalleled, premium travel experience.
        </div>
        
        <div class="sub-headline">
            Our official launch is imminent.
        </div>
        
        <div class="divider"></div>
        
        <div class="legal-note">
            Note: SkyLynx Travel is not currently offering or selling travel services. 
        </div>
    </div>
</body>
</html>
