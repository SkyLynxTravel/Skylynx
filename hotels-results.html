<!DOCTYPE html>
<html lang="en" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyLynx | Luxury Hotels</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --deep-ocean: #051923; 
            --sky-glow: #00a6fb; 
            --silver: #e0e1dd; 
            --gold: #d4af37;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        [lang="ar"] { 
            direction: rtl; 
            font-family: 'Cairo', sans-serif;
        }
        
        [lang="en"] { 
            direction: ltr; 
            font-family: 'Montserrat', sans-serif;
        }
        
        body { 
            background-color: var(--deep-ocean); 
            color: white; 
            overflow-x: hidden; 
        }
        
        .results-header {
            background: linear-gradient(rgba(5, 25, 35, 0.9), rgba(5, 25, 35, 0.7)), 
                        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200');
            background-size: cover;
            padding: 80px 5%;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .results-header h1 {
            font-family: 'Cinzel';
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--sky-glow);
        }
        
        .search-summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .search-item {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .search-item i {
            color: var(--sky-glow);
            margin-right: 10px;
        }
        
        [lang="ar"] .search-item i {
            margin-right: 0;
            margin-left: 10px;
        }
        
        .results-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
        }
        
        .filters-sidebar {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            height: fit-content;
        }
        
        .filter-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .filter-section h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--silver);
        }
        
        .stars-filter {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .star-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .star-option input {
            width: 18px;
            height: 18px;
        }
        
        .amenities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .amenity-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        .results-main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .results-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .sort-select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .results-count {
            font-size: 1.1rem;
        }
        
        .results-count span {
            color: var(--sky-glow);
            font-weight: 700;
        }
        
        .hotel-card {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            display: grid;
            grid-template-columns: 350px 1fr;
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .hotel-card:hover {
            transform: translateY(-5px);
            border-color: var(--sky-glow);
        }
        
        .hotel-image {
            height: 250px;
            position: relative;
            overflow: hidden;
        }
        
        .hotel-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .hotel-card:hover .hotel-image img {
            transform: scale(1.05);
        }
        
        .hotel-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--gold);
            color: var(--deep-ocean);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        
        .hotel-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .hotel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .hotel-name h2 {
            font-family: 'Cinzel';
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .hotel-location {
            color: var(--silver);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .hotel-rating {
            text-align: right;
        }
        
        .rating-score {
            background: var(--success);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            display: inline-block;
        }
        
        .rating-text {
            font-size: 0.8rem;
            color: var(--silver);
            margin-top: 5px;
        }
        
        .hotel-amenities {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        
        .amenity-tag {
            background: rgba(0, 166, 251, 0.1);
            color: var(--sky-glow);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .hotel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        .hotel-price {
            text-align: right;
        }
        
        .price-amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--sky-glow);
        }
        
        .price-period {
            font-size: 0.9rem;
            color: var(--silver);
        }
        
        .book-btn {
            background: linear-gradient(90deg, var(--sky-glow), #0096cc);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .book-btn:hover {
            background: linear-gradient(90deg, #0096cc, var(--sky-glow));
            box-shadow: 0 5px 20px rgba(0, 166, 251, 0.3);
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            grid-column: 1 / -1;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--sky-glow);
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            z-index: 100;
        }
        
        [lang="ar"] .back-btn {
            left: auto;
            right: 20px;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        @media (max-width: 1024px) {
            .results-container {
                grid-template-columns: 1fr;
            }
            
            .filters-sidebar {
                order: 2;
            }
            
            .hotel-card {
                grid-template-columns: 1fr;
            }
            
            .hotel-image {
                height: 200px;
            }
        }
        
        @media (max-width: 768px) {
            .results-header h1 {
                font-size: 2rem;
            }
            
            .search-summary {
                gap: 15px;
            }
            
            .search-item {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .results-controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .hotel-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .hotel-rating {
                text-align: left;
            }
            
            .hotel-footer {
                flex-direction: column;
                gap: 20px;
            }
            
            .hotel-price {
                text-align: center;
            }
        }
    </style>
</head>
<body>

<!-- Back Button -->
<a href="index.html" class="back-btn" id="backBtn">
    <i class="fas fa-arrow-left"></i>
    <span id="backText">Back to Search</span>
</a>

<!-- Header -->
<header class="results-header">
    <h1 id="pageTitle">Luxury Hotels</h1>
    <p id="pageSubtitle">Curated collection of world-class accommodations</p>
    
    <div class="search-summary" id="searchSummary">
        <!-- Will be filled by JavaScript -->
    </div>
</header>

<!-- Main Container -->
<div class="results-container">
    <!-- Filters Sidebar -->
    <aside class="filters-sidebar">
        <div class="filter-section">
            <h3 id="filterStars">Star Rating</h3>
            <div class="stars-filter">
                <label class="star-option">
                    <input type="checkbox" checked>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <span>5 Stars</span>
                </label>
                <label class="star-option">
                    <input type="checkbox">
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <i class="fas fa-star" style="color:var(--gold)"></i>
                    <span>4 Stars</span>
                </label>
            </div>
        </div>
        
        <div class="filter-section">
            <h3 id="filterAmenities">Amenities</h3>
            <div class="amenities-grid">
                <label class="amenity-option">
                    <input type="checkbox" checked>
                    <i class="fas fa-swimming-pool"></i>
                    <span>Pool</span>
                </label>
                <label class="amenity-option">
                    <input type="checkbox" checked>
                    <i class="fas fa-spa"></i>
                    <span>Spa</span>
                </label>
                <label class="amenity-option">
                    <input type="checkbox">
                    <i class="fas fa-wifi"></i>
                    <span>WiFi</span>
                </label>
                <label class="amenity-option">
                    <input type="checkbox">
                    <i class="fas fa-utensils"></i>
                    <span>Restaurant</span>
                </label>
            </div>
        </div>
        
        <button onclick="applyFilters()" class="book-btn" style="width:100%; margin-top:20px;" id="applyFilters">
            <i class="fas fa-filter"></i>
            <span>Apply Filters</span>
        </button>
    </aside>

    <!-- Results Main -->
    <main class="results-main">
        <div class="results-controls">
            <div class="results-count" id="resultsCount">
                <span>6</span> luxury hotels found
            </div>
            
            <div>
                <label for="sortSelect" id="sortLabel">Sort by: </label>
                <select class="sort-select" id="sortSelect" onchange="sortHotels(this.value)">
                    <option value="recommended">Recommended</option>
                    <option value="price_low">Price (Low to High)</option>
                    <option value="price_high">Price (High to Low)</option>
                    <option value="rating">Guest Rating</option>
                </select>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading-hotels">
            <div class="loader"></div>
            <p id="loadingText">Loading luxury hotels...</p>
        </div>

        <!-- Hotel Results -->
        <div id="hotel-results">
            <!-- Will be filled by JavaScript -->
        </div>
    </main>
</div>

        // تحديث النصوص
        updateTexts();
        
        // تحديث ملخص البحث

        // جلب الفنادق

    // تحديث النصوص
    function updateTexts() {
        const lang = langData[currentLang];
        
        document.getElementById('pageTitle').textContent = lang.pageTitle;
        document.getElementById('pageSubtitle').textContent = lang.pageSubtitle;
        document.getElementById('backText').textContent = lang.back;
        document.getElementById('loadingText').textContent = lang.loading;
        document.getElementById('filterStars').textContent = lang.filterStars;
        document.getElementById('filterAmenities').textContent = lang.filterAmenities;
        document.getElementById('applyFilters').querySelector('span').textContent = lang.applyFilters;
        document.getElementById('sortLabel').textContent = lang.sortLabel;
    }

    // تحديث ملخص البحث
    function updateSearchSummary() {
        const lang = langData[currentLang];
        const nights = calculateNights(searchData.checkin, searchData.checkout);
        
        const summaryHTML = `
            <div class="search-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>${searchData.location}</span>
            </div>
            <div class="search-item">
                <i class="fas fa-calendar-alt"></i>
                <span>${formatDate(searchData.checkin)} - ${formatDate(searchData.checkout)}</span>
            </div>
            <div class="search-item">
                <i class="fas fa-users"></i>
                <span>${searchData.guests} Guests • ${searchData.rooms} Room • ${nights} Nights</span>
            </div>
        `;
        
        document.getElementById('searchSummary').innerHTML = summaryHTML;
    }

        const loadingElement = document.getElementById('loading-hotels');

        // انتظار قصير

        // جلب الفنادق حسب المدينة المختارة
        hotels = getHotelsByCity(searchData.location);
        
        // عرض النتائج
        displayHotels(hotels);
        loadingElement.style.display = 'none';
    }

    // وظيفة إنشاء رابط الفندق
    function getHotelLink(hotel) {
        // رابط مباشر لـ Booking.com
        const searchQuery = encodeURIComponent(`${hotel.name} ${hotel.location}`);
        return `https://www.booking.com/searchresults.html?ss=${searchQuery}&lang=${currentLang === 'ar' ? 'ar' : 'en'}`;
    }

    // عرض الفنادق
    function displayHotels(hotelsArray) {
        const resultsContainer = document.getElementById('hotel-results');
        const lang = langData[currentLang];
        
        if (!hotelsArray || hotelsArray.length === 0) {
            resultsContainer.innerHTML = `
                <div style="text-align:center; padding:60px; grid-column:1/-1;">
                    <i class="fas fa-hotel" style="font-size:3rem; color:var(--sky-glow); margin-bottom:20px;"></i>
                    <h3>${currentLang === 'ar' ? 'لم يتم العثور على فنادق في' : 'No hotels found in'} ${searchData.location}</h3>
                    <p style="color:var(--silver); margin:10px 0;">${currentLang === 'ar' ? 'حاول البحث في مدينة أخرى' : 'Try searching in a different city'}</p>
                    <a href="index.html" class="book-btn" style="margin-top:20px; display:inline-flex;">
                        <i class="fas fa-search"></i>
                        <span>${currentLang === 'ar' ? 'بحث جديد' : 'New Search'}</span>
                    </a>
                </div>
            `;
            document.getElementById('resultsCount').innerHTML = `<span>0</span> ${lang.resultsCount}`;
            return;
        }
        
        let hotelsHTML = '';
        
        hotelsArray.forEach(hotel => {
            // نجوم التقييم
            let starsHTML = '';
            for (let i = 0; i < hotel.rating; i++) {
                starsHTML += '<i class="fas fa-star" style="color:var(--gold); margin-right:2px;"></i>';
            }
            
            // المرافق
            let amenitiesHTML = '';
            const amenitiesToShow = hotel.amenities.slice(0, 4);
            amenitiesToShow.forEach(amenity => {
                amenitiesHTML += `<span class="amenity-tag">${amenity}</span>`;
            });
            
            // السعر
            const nights = calculateNights(searchData.checkin, searchData.checkout);
            const totalPrice = hotel.price_per_night * nights;
            const formattedPrice = formatCurrency(hotel.price_per_night);
            const formattedTotal = formatCurrency(totalPrice);
            
            // رابط الحجز
            const bookingLink = getHotelLink(hotel);
            
            hotelsHTML += `
                <div class="hotel-card">
                    <div class="hotel-image">
                        <img src="${hotel.image}" alt="${hotel.name}">
                        <div class="hotel-badge">${hotel.rating} ${currentLang === 'ar' ? 'نجوم' : 'Stars'}</div>
                    </div>
                    
                    <div class="hotel-info">
                        <div class="hotel-header">
                            <div class="hotel-name">
                                <h2>${hotel.name}</h2>
                                <div class="hotel-location">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <span>${hotel.location}</span>
                                </div>
                                <div style="margin-top:5px;">${starsHTML}</div>
                            </div>
                            
                            <div class="hotel-rating">
                                <div class="rating-score">${hotel.review_score}</div>
                                <div class="rating-text">${lang.excellent}<br>${hotel.review_count} ${lang.reviews}</div>
                            </div>
                        </div>
                        
                        <p style="color:var(--silver); margin:10px 0; font-size:0.9rem;">${hotel.description}</p>
                        
                        <div class="hotel-amenities">
                            ${amenitiesHTML}
                            ${hotel.amenities.length > 4 ? 
                                `<span class="amenity-tag">+${hotel.amenities.length - 4} ${currentLang === 'ar' ? 'المزيد' : 'more'}</span>` : ''}
                        </div>
                        
                        <div class="hotel-footer">
                            <button class="book-btn" onclick="window.open('${bookingLink}', '_blank')">
                                <i class="fas fa-calendar-check"></i>
                                <span>${lang.bookNow}</span>
                            </button>
                            
                            <div class="hotel-price">
                                <div class="price-amount">${formattedPrice}</div>
                                <div class="price-period">${lang.perNight} • ${lang.total}: ${formattedTotal}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        resultsContainer.innerHTML = hotelsHTML;
        document.getElementById('resultsCount').innerHTML = `<span>${hotelsArray.length}</span> ${lang.resultsCount}`;
    }

    // تطبيق الفلاتر
    function applyFilters() {
        alert(currentLang === 'ar' ? 'سيتم تطبيق الفلاتر في التحديث القادم' : 'Filters will be applied in the next update');
    }

    // ترتيب الفنادق
    function sortHotels(criteria) {
        let sortedHotels = [...hotels];
        
        switch(criteria) {
            case 'price_low':
                sortedHotels.sort((a, b) => a.price_per_night - b.price_per_night);
                break;
            case 'price_high':
                sortedHotels.sort((a, b) => b.price_per_night - a.price_per_night);
                break;
            case 'rating':
                sortedHotels.sort((a, b) => b.review_score - a.review_score);
                break;
            default:
                // Recommended (الافتراضي)
                break;
        }
        
        displayHotels(sortedHotels);
    }

    // وظائف مساعدة
    function formatDate(dateString) {
        const date = new Date(dateString);
        if (currentLang === 'ar') {
            return date.toLocaleDateString('ar-SA', { 
                month: 'short',
                day: 'numeric' 
            });
        } else {
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric' 
            });
        }
    }

    function formatCurrency(amount) {
        const currencies = {
            'CAD': 'CA$',
            'USD': '$',
            'SAR': 'SAR',
            'EUR': '€',
            'GBP': '£'
        };
        
        const symbol = currencies[searchData.currency] || '$';
        return `${symbol}${amount.toLocaleString()}`;
    }

    function calculateNights(checkin, checkout) {
        if (!checkin || !checkout) return 3;
        const oneDay = 24 * 60 * 60 * 1000;
        const firstDate = new Date(checkin);
        const secondDate = new Date(checkout);
        const nights = Math.round(Math.abs((firstDate - secondDate) / oneDay));
        return nights || 1;
    }
